name: Fetch results

# Manual, click-to-run result fetch — no local Python needed. Fetches the
# final score for every game in the given week that doesn't already have
# an outcome recorded, records it, and commits the updated pool.db back to
# this branch. A game that hasn't finished yet is skipped, not an error —
# safe to re-run mid-week as more games wrap up.
#
# Requires a repo secret named THE_ODDS_API_KEY (Settings -> Secrets and
# variables -> Actions -> New repository secret) — the same one used by
# the "Fetch spreads" workflow.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season year"
        required: true
        default: "2026"
      week:
        description: "Week number"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Fetch completed results for the week
        env:
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
        run: >
          python -m pool.cli fetch-results
          --season "${{ inputs.season }}"
          --week "${{ inputs.week }}"

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.db
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-fetch results: season ${{ inputs.season }}, week ${{ inputs.week }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
